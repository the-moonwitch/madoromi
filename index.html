<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>madoromi 微睡</title>
    <meta name="description" content="Forty of Pilot's iroshizuku inks, scanned and traced from dense to pale, and colour themes made of them: four seasons, by day and by night." />
    <meta property="og:title" content="madoromi 微睡" />
    <meta property="og:description" content="Colour themes made of fountain pen inks: four seasons, by day and by night, for terminals, editors and the web." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Everything the first screen shows; fetched while the script loads. -->
    <link rel="preload" href="/precomputed/summary.json" as="fetch" crossorigin />
    <!-- madoromi:theme -->
    <script>
      // The chosen flavour's paper and ink, before the page is drawn (see src/theme.tsx).
      (function () {
        var P = {"haru-hiru":["#f6eff8","#584a5c","#77697c","#a99cad","#d9ccdd","#1955bf","#6c2ac1"],"natsu-hiru":["#e9f4f8","#3b545e","#57717a","#8fa6ae","#bed6df","#3b545e","#6526b9"],"aki-hiru":["#f8f0e9","#5d4c3c","#7d6b5a","#ae9e90","#dfcebf","#20609e","#551aa2"],"fuyu-hiru":["#f0f1f8","#4a4e63","#696d83","#9ca0b3","#ccd0e4","#2266a4","#6223b4"],"haru-yoru":["#241c26","#e1d1e7","#b7a8bd","#756a7a","#392e3c","#7bddff","#dfb8ff"],"natsu-yoru":["#132227","#c0dde8","#97b3be","#5d737b","#23363d","#5cd7f5","#d3a1ff"],"aki-yoru":["#271d14","#e8d3c1","#beaa98","#7b6c5e","#3d3024","#66c7dd","#d09dff"],"fuyu-yoru":["#1c1e2a","#d2d6eb","#a8adc4","#6a6e7f","#2f3241","#6ccff8","#bbb8ff"]};
        var id;
        try { id = localStorage.getItem("madoromi-flavour"); } catch (e) {}
        if (!P[id]) {
          var m = new Date().getMonth();
          var s = m >= 2 && m <= 4 ? "haru" : m >= 5 && m <= 7 ? "natsu" : m >= 8 && m <= 10 ? "aki" : "fuyu";
          id = s + (matchMedia("(prefers-color-scheme: dark)").matches ? "-yoru" : "-hiru");
        }
        var c = P[id], r = document.documentElement.style, n = ["--paper", "--ink", "--dim", "--faint", "--hair", "--link", "--m-fuji"];
        for (var i = 0; i < n.length; i++) r.setProperty(n[i], c[i]);
        r.setProperty("color-scheme", id.slice(-4) === "yoru" ? "dark" : "light");
        var l = document.createElement("link");
        l.rel = "preload"; l.as = "image"; l.href = "/precomputed/strokes" + (id.slice(-4) === "yoru" ? "-yoru" : "") + ".webp";
        document.head.appendChild(l);
      })();
    </script>
    <!-- /madoromi:theme -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
